# Lecture 22: proxy + three API replicas, all on the host network (so they reach the existing eventhub-pg/redis
# containers on 127.0.0.1 and each other on 127.0.0.1:8081-8083). Replica containers are OPTIONAL: the same replicas
# can run as plain processes (scale/replicas.sh). Start them with: docker compose --profile replicas up -d --build
# nginx.conf is generated by scale/lb.sh from nginx.conf.template.
services:
  lb:
    image: nginx:alpine
    container_name: eventhub-lb
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  # One build, three instances. node is PID 1 (exec-form CMD), so `docker stop` delivers SIGTERM to the app itself.
  # env_file supplies DATABASE_URL, REDIS_URL, ... from the git-ignored backend/.env; nothing is baked into the image.
  api1: &api
    profiles: ["replicas"]
    image: eventhub-api:lab
    build: { context: .., dockerfile: Dockerfile }
    network_mode: host
    env_file: ../.env
    environment: &apienv
      PORT: "8081"
      SEED_DEMO_USERS: "0"
      TRUSTED_PROXIES: 127.0.0.2
      LOG_LEVEL: warn
      SHUTDOWN_TIMEOUT_MS: "10000"
      SHUTDOWN_DRAIN_DELAY_MS: "1500"
    stop_grace_period: 15s
    restart: "no"
  api2:
    <<: *api
    environment: { <<: *apienv, PORT: "8082" }
  api3:
    <<: *api
    environment: { <<: *apienv, PORT: "8083" }
