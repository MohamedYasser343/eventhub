# Lecture 22: ONLY the proxy is containerised (host network, so it reaches the API replicas on 127.0.0.1:8081-8083).
# The API replicas are plain Node processes (scale/replicas.sh): no Node image is needed, signals reach the app
# directly (no wrapper as PID 1), and the existing eventhub-pg / redis containers are reused unchanged.
# nginx.conf is generated by scale/lb.sh from nginx.conf.template.
services:
  lb:
    image: nginx:alpine
    container_name: eventhub-lb
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
